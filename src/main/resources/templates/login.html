<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Вход в систему</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f7f7f7;
            margin: 40px;
            color: #333;
        }
        .main-div {
            width: 340px;
            margin: 40px auto;
            background: #fff;
            border: 1px solid #ccc;
            padding: 20px;
        }
        .panel {
            margin-bottom: 15px;
        }
        .form-heading {
            font-size: 18px;
            margin-top: 0;
            margin-bottom: 10px;
        }
        .form-group {
            margin-bottom: 12px;
        }
        label {
            display: block;
            margin-bottom: 4px;
            font-size: 13px;
        }
        .form-control {
            width: 100%;
            box-sizing: border-box;
            padding: 6px 8px;
            border: 1px solid #ccc;
            font-size: 14px;
        }
        .btn {
            padding: 6px 12px;
            cursor: pointer;
            border: 1px solid #333;
            background: #eee;
        }
        .btn-primary {
            background: #0066cc;
            color: #fff;
            border: 1px solid #0055aa;
            width: 100%;
        }
        .btn-primary:hover {
            background: #0055aa;
        }
        .alert {
            padding: 8px 10px;
            margin-bottom: 12px;
            font-size: 13px;
            border: 1px solid transparent;
        }
        .alert-danger {
            background-color: #f8d7da;
            color: #721c24;
            border-color: #f5c6cb;
        }
        .alert-success {
            background-color: #d4edda;
            color: #155724;
            border-color: #c3e6cb;
        }
        .hint {
            margin-top: 15px;
            font-size: 12px;
            color: #666;
            border-top: 1px solid #eee;
            padding-top: 10px;
        }
    </style>
</head>
<body>

<div class="main-div">
    <div class="panel">
        <h2 class="form-heading">Our University Database</h2>
        <p style="font-size: 13px; color: #555;">Please enter your login and password</p>

        <!-- Сообщения методички (стр. 49) -->
        <div th:if="${param.error}" class="alert alert-danger">Unknown username or password.</div>
        <div th:if="${param.logout}" class="alert alert-success">Good bye!</div>
    </div>

    <!-- Форма логина (методичка стр. 49) -->
    <form id="Login" th:action="@{/login}" method="post">
        <div class="form-group">
            <label for="login">Логин:</label>
            <input type="text" class="form-control" id="login" name="login" placeholder="Login" required autofocus/>
        </div>

        <div class="form-group">
            <label for="pass">Пароль:</label>
            <input type="password" class="form-control" id="pass" name="pass" placeholder="Password" required/>
        </div>

        <button type="submit" class="btn btn-primary">Login</button>
    </form>

    <div class="hint">
        Тестовые учетные записи:<br>
        &bull; <b>user</b> / <code>password</code> (роль USER — только чтение)<br>
        &bull; <b>admin</b> / <code>admin</code> (роль ADMIN — чтение и запись)
    </div>
</div>

</body>
</html>
