# Настройки приложения Spring Boot
server.port=8443

# Имя приложения
spring.application.name=bookstore

# ─── SSL / HTTPS ──────────────────────────────────────────────────────
# Методичка (стр. 47): "server.port: 8443 / server.ssl.key-store: ..."
server.ssl.key-store=classpath:keystore.p12
server.ssl.key-store-password=mypassword
server.ssl.keyStoreType=PKCS12
server.ssl.keyAlias=tomcat

# ─── Swagger / OpenAPI ───────────────────────────────────────────────
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui/index.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.tryItOutEnabled=true

# ─── Аудит / Логирование ─────────────────────────────────────────────
logging.level.ru.spbguap.bookstore=DEBUG
logging.level.org.springframework.security=INFO

# ─── База данных H2 & JPA / Hibernate ────────────────────────────────
spring.datasource.url=jdbc:h2:mem:bookstoredb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

